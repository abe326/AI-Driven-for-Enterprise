<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" font-family="'Inter','Segoe UI','Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <filter id="sp" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="11" flood-color="#1e293b" flood-opacity="0.13"/>
    </filter>
    <marker id="fA" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="vA" markerWidth="11" markerHeight="11" refX="6" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,5 L0,10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="680" fill="url(#bg3)"/>

  <text x="490" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">新規開発：SDD ／ Spec-Anchored ／ V字ハーネス</text>
  <text x="490" y="80" text-anchor="middle" font-size="14" fill="#64748b">左の下降で仕様を段階確定（承認ゲート）／ 右の上昇で対応テストと照合（ハーネスのフィードバック）</text>

  <!-- V linkage dashed lines (draw behind cards) -->
  <line x1="282" y1="139" x2="718" y2="139" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="6 6"/>
  <line x1="362" y1="219" x2="638" y2="219" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="6 6"/>
  <line x1="442" y1="299" x2="558" y2="299" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="6 6"/>
  <rect x="430" y="127" width="140" height="22" rx="11" fill="#f5f3ff" stroke="#e9d5ff"/><text x="500" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">要件 ⇔ 運用テスト</text>
  <rect x="404" y="207" width="192" height="22" rx="11" fill="#f5f3ff" stroke="#e9d5ff"/><text x="500" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">基本設計 ⇔ 結合・システムテスト</text>
  <rect x="424" y="287" width="152" height="22" rx="11" fill="#f5f3ff" stroke="#e9d5ff"/><text x="500" y="302" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">詳細設計 ⇔ 単体テスト</text>

  <!-- flow arrows -->
  <path d="M175 170 L 250 192" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#fA)"/>
  <path d="M255 250 L 330 272" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#fA)"/>
  <path d="M335 330 L 405 352" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#fA)"/>
  <path d="M620 352 L 690 330" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#fA)"/>
  <path d="M745 272 L 815 250" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#fA)"/>
  <path d="M825 192 L 895 170" fill="none" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#fA)"/>

  <!-- left (upstream) cards -->
  <g filter="url(#sp)"><rect x="70" y="110" width="210" height="60" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/></g>
  <rect x="84" y="124" width="6" height="32" rx="3" fill="#10b981"/>
  <text x="102" y="138" font-size="15" font-weight="700" fill="#0f172a">要件</text>
  <text x="102" y="157" font-size="10.5" fill="#94a3b8">requirements-reviewer</text>

  <g filter="url(#sp)"><rect x="150" y="190" width="210" height="60" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/></g>
  <rect x="164" y="204" width="6" height="32" rx="3" fill="#10b981"/>
  <text x="182" y="218" font-size="15" font-weight="700" fill="#0f172a">基本設計</text>
  <text x="182" y="237" font-size="10.5" fill="#94a3b8">basic-design-reviewer</text>

  <g filter="url(#sp)"><rect x="230" y="270" width="210" height="60" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/></g>
  <rect x="244" y="284" width="6" height="32" rx="3" fill="#10b981"/>
  <text x="262" y="298" font-size="14.5" font-weight="700" fill="#0f172a">詳細設計／実装計画</text>
  <text x="262" y="317" font-size="10.5" fill="#94a3b8">detail-design-reviewer</text>

  <!-- implementation (bottom center) -->
  <g filter="url(#sp)"><rect x="360" y="350" width="260" height="66" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/></g>
  <rect x="376" y="366" width="6" height="34" rx="3" fill="#f59e0b"/>
  <text x="394" y="382" font-size="15" font-weight="700" fill="#92400e">実装（SDD: 仕様 → コード）</text>
  <text x="394" y="402" font-size="10.5" fill="#b45309">code-reviewer ／ security-reviewer</text>

  <!-- right (test) cards -->
  <g filter="url(#sp)"><rect x="560" y="270" width="210" height="60" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/></g>
  <rect x="574" y="284" width="6" height="32" rx="3" fill="#3b82f6"/>
  <text x="592" y="298" font-size="15" font-weight="700" fill="#0f172a">単体テスト</text>
  <text x="592" y="317" font-size="10.5" fill="#94a3b8">unit test</text>

  <g filter="url(#sp)"><rect x="640" y="190" width="210" height="60" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/></g>
  <rect x="654" y="204" width="6" height="32" rx="3" fill="#3b82f6"/>
  <text x="672" y="218" font-size="14.5" font-weight="700" fill="#0f172a">結合・システムテスト</text>
  <text x="672" y="237" font-size="10.5" fill="#94a3b8">integration ／ system</text>

  <g filter="url(#sp)"><rect x="720" y="110" width="210" height="60" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.3"/></g>
  <rect x="734" y="124" width="6" height="32" rx="3" fill="#3b82f6"/>
  <text x="752" y="138" font-size="15" font-weight="700" fill="#0f172a">運用テスト</text>
  <text x="752" y="157" font-size="10.5" fill="#94a3b8">acceptance ／ operation</text>

  <!-- Spec-Anchored panel -->
  <line x1="490" y1="416" x2="490" y2="468" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#vA)" marker-start="url(#vA)"/>
  <g filter="url(#sp)"><rect x="330" y="470" width="320" height="96" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/></g>
  <circle cx="356" cy="498" r="6" fill="#8b5cf6"/>
  <text x="372" y="503" font-size="14.5" font-weight="700" fill="#6d28d9">Spec-Anchored（仕様双方向同期）</text>
  <text x="356" y="528" font-size="11.8" fill="#6b21a8">実装中の仕様外判断は、反映フローで仕様へ戻す</text>
  <text x="356" y="550" font-size="11.8" fill="#6b21a8">差異検出時 → ①仕様更新 ②コード修正 ③課題化</text>

  <!-- legend -->
  <circle cx="360" cy="606" r="5" fill="#10b981"/><text x="372" y="610" font-size="11.5" fill="#475569">上流（前フェーズ準拠を点検）</text>
  <line x1="558" y1="606" x2="582" y2="606" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 4"/><text x="592" y="610" font-size="11.5" fill="#475569">V字照合</text>
  <circle cx="690" cy="606" r="5" fill="#3b82f6"/><text x="702" y="610" font-size="11.5" fill="#475569">テスト（対応工程）</text>

  <text x="490" y="650" text-anchor="middle" font-size="12.5" fill="#94a3b8">各フェーズ完了時にペルソナレビューを独立コンテキストで起動し、仕様という外部基準で点検する</text>
</svg>
