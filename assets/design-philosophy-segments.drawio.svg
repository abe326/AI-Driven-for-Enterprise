<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="'Inter','Segoe UI','Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <filter id="sc" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.13"/>
    </filter>
    <clipPath id="cp_pm"><rect x="40" y="200" width="210" height="380" rx="18"/></clipPath>
    <clipPath id="cp_pr"><rect x="270" y="200" width="210" height="380" rx="18"/></clipPath>
    <clipPath id="cp_dv"><rect x="500" y="200" width="210" height="380" rx="18"/></clipPath>
    <clipPath id="cp_op"><rect x="730" y="200" width="210" height="380" rx="18"/></clipPath>
  </defs>
  <rect x="0" y="0" width="980" height="660" fill="url(#bg2)"/>

  <text x="490" y="54" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">4セグメント・1軸 × 2利用モード</text>
  <text x="490" y="83" text-anchor="middle" font-size="14.5" fill="#64748b">Enterprise 向け（監査・トレーサビリティは選択式オプション）</text>

  <!-- mode band -->
  <rect x="110" y="104" width="360" height="58" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.4"/>
  <circle cx="138" cy="133" r="7" fill="#8b5cf6"/>
  <text x="158" y="129" font-size="15" font-weight="700" fill="#7c3aed">自由モード（init 不要）</text>
  <text x="158" y="148" font-size="11.5" fill="#7c3aed" fill-opacity="0.8">提案ベースで自由に・aide-advisor</text>

  <rect x="510" y="104" width="360" height="58" rx="16" fill="#eef2ff" stroke="#e0e7ff" stroke-width="1.4"/>
  <circle cx="538" cy="133" r="7" fill="#4f46e5"/>
  <text x="558" y="129" font-size="15" font-weight="700" fill="#4338ca">伴走モード（init 済）</text>
  <text x="558" y="148" font-size="11.5" fill="#4338ca" fill-opacity="0.8">セグメントに沿って伴走・aide-journey</text>

  <text x="490" y="188" text-anchor="middle" font-size="13" fill="#94a3b8">どちらのモードでも、対象者を次の4セグメント・1軸で捉える</text>

  <!-- ===== PM ===== -->
  <g clip-path="url(#cp_pm)"><rect x="40" y="200" width="210" height="380" fill="#ffffff"/><rect x="40" y="200" width="210" height="52" fill="#f59e0b"/></g>
  <rect x="40" y="200" width="210" height="380" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sc)"/>
  <text x="58" y="232" font-size="17" font-weight="700" fill="#ffffff">PM業務</text>
  <rect x="194" y="214" width="44" height="24" rx="12" fill="#ffffff" fill-opacity="0.28"/><text x="216" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">pm</text>
  <text x="58" y="286" font-size="12.5" fill="#334155">KPI／ゴールを設定し</text>
  <text x="58" y="306" font-size="12.5" fill="#334155">プロジェクトを管理する</text>
  <line x1="58" y1="332" x2="232" y2="332" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="58" y="356" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">流れ</text>
  <text x="58" y="380" font-size="11.5" fill="#475569">憲章 → 管理 →</text>
  <text x="58" y="400" font-size="11.5" fill="#475569">議事録 / 見積 / 資料</text>
  <text x="58" y="420" font-size="11.5" fill="#475569">→ 振り返り</text>
  <rect x="58" y="528" width="104" height="28" rx="14" fill="#fef3e2"/><text x="110" y="546" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">課題 I-XXX</text>

  <!-- ===== PRODUCT ===== -->
  <g clip-path="url(#cp_pr)"><rect x="270" y="200" width="210" height="380" fill="#ffffff"/><rect x="270" y="200" width="210" height="52" fill="#0ea5e9"/></g>
  <rect x="270" y="200" width="210" height="380" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sc)"/>
  <text x="288" y="232" font-size="17" font-weight="700" fill="#ffffff">製品運用</text>
  <rect x="404" y="214" width="64" height="24" rx="12" fill="#ffffff" fill-opacity="0.28"/><text x="436" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">product</text>
  <text x="288" y="286" font-size="12.5" fill="#334155">製品の設定作業と</text>
  <text x="288" y="306" font-size="12.5" fill="#334155">問題解決</text>
  <text x="288" y="326" font-size="11.5" fill="#94a3b8">（コードを書かない）</text>
  <line x1="288" y1="346" x2="462" y2="346" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="288" y="370" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">流れ</text>
  <text x="288" y="394" font-size="11.5" fill="#475569">課題受付 →</text>
  <text x="288" y="414" font-size="11.5" fill="#475569">バージョン指定で</text>
  <text x="288" y="434" font-size="11.5" fill="#475569">公式情報検索 → 記録</text>
  <rect x="288" y="528" width="104" height="28" rx="14" fill="#e0f2fe"/><text x="340" y="546" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">課題 I-XXX</text>

  <!-- ===== DEV ===== -->
  <g clip-path="url(#cp_dv)"><rect x="500" y="200" width="210" height="380" fill="#ffffff"/><rect x="500" y="200" width="210" height="52" fill="#10b981"/></g>
  <rect x="500" y="200" width="210" height="380" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sc)"/>
  <text x="518" y="232" font-size="17" font-weight="700" fill="#ffffff">新規開発</text>
  <rect x="654" y="214" width="44" height="24" rx="12" fill="#ffffff" fill-opacity="0.28"/><text x="676" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">dev</text>
  <text x="518" y="286" font-size="12.5" fill="#334155">ウォーターフォール</text>
  <text x="518" y="306" font-size="12.5" fill="#334155">×SDD の AI 駆動開発</text>
  <line x1="518" y1="332" x2="692" y2="332" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="518" y="356" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">流れ</text>
  <text x="518" y="380" font-size="11.5" fill="#475569">要件 → 設計 → 実装</text>
  <text x="518" y="400" font-size="11.5" fill="#475569">→ 単体 / 結合 / ST / 運用</text>
  <text x="518" y="420" font-size="11.5" fill="#475569">V字ペルソナレビュー</text>
  <rect x="518" y="528" width="104" height="28" rx="14" fill="#e7f9f1"/><text x="570" y="546" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">課題 I-XXX</text>

  <!-- ===== OPS ===== -->
  <g clip-path="url(#cp_op)"><rect x="730" y="200" width="210" height="380" fill="#ffffff"/><rect x="730" y="200" width="210" height="52" fill="#f43f5e"/></g>
  <rect x="730" y="200" width="210" height="380" rx="18" fill="none" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sc)"/>
  <text x="748" y="232" font-size="17" font-weight="700" fill="#ffffff">既存運用</text>
  <rect x="884" y="214" width="44" height="24" rx="12" fill="#ffffff" fill-opacity="0.28"/><text x="906" y="231" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">ops</text>
  <text x="748" y="286" font-size="12.5" fill="#334155">問い合わせ・課題・</text>
  <text x="748" y="306" font-size="12.5" fill="#334155">障害への対応</text>
  <line x1="748" y1="332" x2="922" y2="332" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="748" y="356" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">流れ</text>
  <text x="748" y="380" font-size="11.5" fill="#475569">受付 → 調査 →</text>
  <text x="748" y="400" font-size="11.5" fill="#475569">修正 → クローズ</text>
  <text x="748" y="420" font-size="11.5" fill="#475569">課題管理は必須</text>
  <rect x="748" y="528" width="110" height="28" rx="14" fill="#ffe4e6"/><text x="803" y="546" text-anchor="middle" font-size="12" font-weight="600" fill="#e11d48">タスク T-XXX</text>

  <text x="490" y="628" text-anchor="middle" font-size="12.5" fill="#94a3b8">複数セグメント併用可（例: pm ＋ dev）　／　両モードは同じ3大原則の上に立つ</text>
</svg>
