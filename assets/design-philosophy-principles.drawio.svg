<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="'Inter','Segoe UI','Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="gEntrance" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="gFree" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gComp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.13"/>
    </filter>
    <filter id="shSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <marker id="mGray" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="mViolet" markerWidth="13" markerHeight="13" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/>
    </marker>
    <clipPath id="clipFree"><rect x="70" y="210" width="370" height="410" rx="20"/></clipPath>
    <clipPath id="clipComp"><rect x="520" y="210" width="370" height="410" rx="20"/></clipPath>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="url(#bg)"/>

  <!-- title -->
  <text x="480" y="56" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a" letter-spacing="0.5">aide の入り口：2つの利用モード</text>
  <text x="480" y="85" text-anchor="middle" font-size="14.5" fill="#64748b">自由モードと伴走モード。伴走モードの土台が3大原則。自由モードも同じ仕組みを呼び出して精度が上がる</text>

  <!-- entrance node -->
  <rect x="375" y="106" width="210" height="62" rx="31" fill="url(#gEntrance)" filter="url(#shCard)"/>
  <text x="480" y="136" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">aide を使い始める</text>
  <text x="480" y="156" text-anchor="middle" font-size="11.5" fill="#e0e7ff">＝ ここが入り口</text>

  <!-- branch arrows -->
  <path d="M450 168 C 380 188, 320 192, 256 206" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#mGray)"/>
  <path d="M510 168 C 580 188, 640 192, 704 206" fill="none" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#mGray)"/>

  <!-- ===== FREE MODE CARD ===== -->
  <g clip-path="url(#clipFree)">
    <rect x="70" y="210" width="370" height="410" fill="#ffffff"/>
    <rect x="70" y="210" width="370" height="66" fill="url(#gFree)"/>
  </g>
  <rect x="70" y="210" width="370" height="410" rx="20" fill="none" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shCard)"/>
  <text x="92" y="251" font-size="20" font-weight="700" fill="#ffffff">自由モード</text>
  <rect x="338" y="226" width="84" height="26" rx="13" fill="#ffffff" fill-opacity="0.24"/>
  <text x="380" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">init 不要</text>

  <text x="92" y="312" font-size="15.5" font-weight="700" fill="#1e293b">名前のとおり、自由に使える</text>
  <circle cx="98" cy="342" r="3" fill="#8b5cf6"/><text x="112" y="347" font-size="13" fill="#475569">指定なしで、やりたいことを指示するだけ</text>
  <circle cx="98" cy="370" r="3" fill="#8b5cf6"/><text x="112" y="375" font-size="13" fill="#475569">曖昧なら決め打ちせず確認・ブレスト</text>
  <circle cx="98" cy="398" r="3" fill="#8b5cf6"/><text x="112" y="403" font-size="13" fill="#475569">現在地を分析し、次の一手を提案</text>

  <rect x="92" y="424" width="326" height="160" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.4"/>
  <circle cx="112" cy="452" r="5" fill="#8b5cf6"/>
  <text x="126" y="457" font-size="13.5" font-weight="700" fill="#7c3aed">精度が上がる仕組み</text>
  <text x="112" y="486" font-size="12.5" fill="#6b21a8">自由モードでも、伴走モードと同じ</text>
  <text x="112" y="508" font-size="12.5" fill="#6b21a8">スキル群が適切に呼び出されるため、</text>
  <text x="112" y="530" font-size="12.5" fill="#6b21a8">出力の精度が自然に向上する。</text>
  <text x="112" y="560" font-size="12" fill="#9333ea" font-style="italic">＝ 自由だが、放任ではない</text>

  <!-- link arrow: free borrows companion's machinery -->
  <path d="M440 452 L 516 452" fill="none" stroke="#8b5cf6" stroke-width="2.4" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#mViolet)"/>

  <!-- ===== COMPANION MODE CARD ===== -->
  <g clip-path="url(#clipComp)">
    <rect x="520" y="210" width="370" height="410" fill="#ffffff"/>
    <rect x="520" y="210" width="370" height="66" fill="url(#gComp)"/>
  </g>
  <rect x="520" y="210" width="370" height="410" rx="20" fill="none" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shCard)"/>
  <text x="542" y="251" font-size="20" font-weight="700" fill="#ffffff">伴走モード</text>
  <rect x="794" y="226" width="74" height="26" rx="13" fill="#ffffff" fill-opacity="0.24"/>
  <text x="831" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">init 済</text>

  <text x="542" y="304" font-size="13.5" fill="#475569">セグメントに沿って伴走。土台となる<tspan font-weight="700" fill="#1e293b">3大原則</tspan>が常に働く</text>

  <!-- principle 1 -->
  <rect x="540" y="320" width="330" height="76" rx="13" fill="#f8fafc" stroke="#eef2f7" stroke-width="1.2" filter="url(#shSoft)"/>
  <rect x="556" y="338" width="6" height="40" rx="3" fill="#6366f1"/>
  <circle cx="846" cy="342" r="11" fill="#eef2ff"/><text x="846" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#4f46e5">1</text>
  <text x="576" y="350" font-size="15" font-weight="700" fill="#0f172a">Human-in-the-Loop</text>
  <text x="576" y="373" font-size="11.8" fill="#64748b">承認ゲート＋ペルソナレビューで入出力を検査</text>

  <!-- principle 2 -->
  <rect x="540" y="404" width="330" height="76" rx="13" fill="#f8fafc" stroke="#eef2f7" stroke-width="1.2" filter="url(#shSoft)"/>
  <rect x="556" y="422" width="6" height="40" rx="3" fill="#10b981"/>
  <circle cx="846" cy="426" r="11" fill="#e7f9f1"/><text x="846" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">2</text>
  <text x="576" y="434" font-size="15" font-weight="700" fill="#0f172a">SSoT（仕様が唯一の正）</text>
  <text x="576" y="457" font-size="11.8" fill="#64748b">SDD＋Spec-Anchored で仕様を常に最新に保つ</text>

  <!-- principle 3 -->
  <rect x="540" y="488" width="330" height="76" rx="13" fill="#f8fafc" stroke="#eef2f7" stroke-width="1.2" filter="url(#shSoft)"/>
  <rect x="556" y="506" width="6" height="40" rx="3" fill="#f59e0b"/>
  <circle cx="846" cy="510" r="11" fill="#fef3e2"/><text x="846" y="514" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706">3</text>
  <text x="576" y="518" font-size="15" font-weight="700" fill="#0f172a">伴走性</text>
  <text x="576" y="541" font-size="11.8" fill="#64748b">確認・提案・承認を挟んでから実行する</text>

  <text x="705" y="596" text-anchor="middle" font-size="11.5" fill="#94a3b8">3者は相互に補強し合う一つの循環（SSoT → HITL → 伴走性 → SSoT）</text>

  <!-- bottom caption -->
  <rect x="180" y="650" width="600" height="38" rx="19" fill="#eef2ff" stroke="#e0e7ff" stroke-width="1.2"/>
  <text x="480" y="674" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">自由モードも、伴走モードのスキル群を適切に呼び出すことで精度が向上する</text>
</svg>
