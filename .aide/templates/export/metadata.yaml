# aide-pm-export 文書メタデータ
# プロジェクト毎にカスタマイズしてください

# プロジェクト情報
project:
  name: "[プロジェクト名]"
  company: "[会社名]"
  department: "[部署名]"

# 文書共通情報
document:
  author: "[作成者名]"
  classification: "社外秘"  # 社外秘 / 公開 / 極秘
  version: "1.0"

# Marpスライド設定
marp:
  # 案件の既定テーマ名（MD frontmatter の theme: が無い場合のフォールバック）。
  # 実体は slide/themes/<theme>/theme.css（.aide-templates/export/ 側があれば優先）。
  theme: "corporate"
  paginate: true

